name: Validate exam publication artifacts

on:
  pull_request:
    paths:
      - "app/public/data/exams/**"
      - "exam-inputs/**"
      - "schemas/exam.schema.json"
      - "scripts/parse_sas_exam.py"
      - "scripts/publish_exam.py"

permissions:
  contents: read

jobs:
  canonical-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-parser.txt
      - name: Validate canonical packages, QA, aliases and catalog
        run: python scripts/publish_exam.py verify-bank
      - name: Validate canonical input and official-source pairs
        run: python scripts/publish_exam.py verify-inputs
      - name: Preserve every existing immutable version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/publish_exam.py verify-immutable --base "$BASE_SHA"
