name: Deploy SAS Quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload built application
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # GitHub Actions artifact indexing can lag slightly behind a completed
      # upload (observed in run 44901892846). Wait for the artifact to become
      # visible through GitHub API before deploying.
      - name: Wait for uploaded Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | grep -Eq '^[0-9]+$'; then
              echo "Pages artifact indexed (attempt ${attempt})"
              exit 0
            fi
            sleep 3
          done
          echo 'Pages artifact not indexed after bounded wait' >&2
          exit 1

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
